[pytest]
# Pytest configuration file

# Custom markers for test organization
markers =
    unit: Unit tests for individual functions
    integration: Integration tests combining multiple functions
    edge_case: Tests for edge cases and boundary values
    parametrized: Tests using parametrization for multiple inputs

# Test paths
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = -v --strict-markers --tb=short
testpaths = .
